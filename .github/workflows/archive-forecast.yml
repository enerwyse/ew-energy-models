name: archive-ieso-forecast

# Builds the open IESO forecast archive: IESO deletes forecasts after ~90 days.
on:
  schedule:
    - cron: "17 14 * * *"   # ~09:17 EST, after the morning revision
    - cron: "47 20 * * *"   # ~15:47 EST, after the afternoon revision
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-forecast
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/archive_ieso_forecast.py data/ieso_forecast_archive.csv
      - name: Commit snapshot
        run: |
          git config user.name "ew-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ieso_forecast_archive.csv
          git diff --cached --quiet || git commit -m "data: IESO forecast snapshot $(date -u +%FT%H:%MZ)"
          git push
