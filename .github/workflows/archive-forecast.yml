name: archive-ieso-forecast

# Builds the open IESO forecast archive. IESO keeps every forecast version for
# only ~45 days, so this runs daily; each run back-fills anything still in
# IESO's window, then fails (and GitHub emails you) if any date is missing.
on:
  schedule:
    - cron: "17 14 * * *"   # ~09:17 EST
    - cron: "47 21 * * *"   # ~16:47 EST, after the afternoon day-ahead revision
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-forecast
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Back-fill new forecast versions
        run: python scripts/archive_ieso_forecast.py --skip-check
      - name: Commit
        run: |
          git config user.name "ew-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ieso_forecast_archive.csv
          git diff --cached --quiet || git commit -m "data: IESO forecast archive $(date -u +%FT%H:%MZ)"
          git push
      - name: Gap check (fails -> email alert)
        run: python scripts/archive_ieso_forecast.py --check-only
